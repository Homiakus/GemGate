clients:
  - name: "local-dev"
    token: "${GEMGATE_TOKEN}"
    # token_file: "/run/secrets/gemgate_token"
    enabled: true
    rate_limit_rpm: 120

logging:
  recent: 300
  # Sensitive body/header capture is intentionally unavailable. true is rejected.
  log_body: false
  log_headers: false

# Hot-reloadable without dropping in-flight requests:
# - providers/default_provider, base_url, keys, headers, provider timeout, circuit policy
# - clients/tokens/enabled/rate_limit_rpm
# - operations token/token_file
# - trusted_proxies, CORS, request_body_limit, logging.recent
#
# Restart required:
# - server listen/read/write/idle timeout settings
# - rate_limit backend/Redis URL, key prefix, timeout and fail_open policy
