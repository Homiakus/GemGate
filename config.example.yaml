# GemGate reloads this file and referenced secret files every 5s by default.
# Change with -reload-interval; use 0 to disable hot reload.
server:
  listen: ":8080"
  read_timeout: "30s"
  write_timeout: "0s"       # keep 0s for long-lived streaming responses
  idle_timeout: "120s"
  public_health: true         # makes /_healthz and /_readyz public
  request_body_limit: "32MiB"

  trusted_proxies: []
  # trusted_proxies:
  #   - "127.0.0.1"
  #   - "10.0.0.0/8"

  cors:
    enabled: true
    allowed_origins:
      - "http://localhost:3000"
    allowed_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
    allowed_headers: ["Authorization", "Content-Type", "X-Request-ID"]
    allow_credentials: false
    max_age: "10m"

# Recommended in production: separate operational control-plane credentials from
# application tokens. When configured, /_metrics, /_config and private health /
# readiness endpoints require this token. It cannot proxy provider requests.
# operations:
#   token_file: "/run/secrets/gemgate_operations_token"
#   # Or: token: "${GEMGATE_OPERATIONS_TOKEN}"

rate_limit:
  backend: memory

# For horizontally scaled deployments use the shared Redis backend instead.
# rate_limit:
#   backend: redis
#   redis:
#     url_file: "/run/secrets/gemgate_redis_url"
#     key_prefix: "gemgate:ratelimit:"
#     timeout: "2s"
#     fail_open: false

default_provider: gemini

providers:
  - name: gemini
    type: gemini
    api_key: "${GEMINI_API_KEY}"
    # api_key_file: "/run/secrets/gemini_api_key"
    timeout: "0s"
    circuit_breaker:
      enabled: true
      failure_threshold: 5
      open_for: "30s"

  # - name: openai
