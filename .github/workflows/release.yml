name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve release metadata
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-rc.1; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Verify source
        run: |
          go mod verify
          go vet ./...
          go test ./...

      - name: Build release archives
        run: ./scripts/build-release.sh

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/gemgate.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Finalize metadata and checksums
        shell: bash
        run: |
          mv dist/gemgate.spdx.json "dist/gemgate_${VERSION}.spdx.json"
          (
            cd dist
            find . -maxdepth 1 -type f ! -name checksums.txt -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum > checksums.txt
          )
          cat dist/checksums.txt

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "GemGate ${VERSION}"
