name: Normalize Go

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/format.yml"
      - "go.mod"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Normalize modules
        run: go mod tidy
      - name: Apply gofmt
        run: gofmt -w .
      - name: Commit normalization if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Repository is already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go' go.mod go.sum
          git commit -m "Normalize Go modules and formatting"
          git push origin HEAD:main
