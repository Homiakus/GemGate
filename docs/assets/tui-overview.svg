<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GemGate TUI overview screen">
  <title>GemGate TUI overview screen</title>
  <style>
    .bg { fill: #0b1020; }
    .panel { fill: #101827; stroke: #344055; stroke-width: 2; }
    .card { fill: #121c2d; stroke: #334155; stroke-width: 2; }
    .tab { fill: #1f2937; }
    .tab-active { fill: #6d28d9; }
    .green-pill { fill: #22c55e; }
    .muted-pill { fill: #263244; }
    .title { fill: #f8fafc; font: 700 24px Consolas, 'Liberation Mono', monospace; }
    .text { fill: #dbeafe; font: 16px Consolas, 'Liberation Mono', monospace; }
    .small { fill: #94a3b8; font: 14px Consolas, 'Liberation Mono', monospace; }
    .value { fill: #5eead4; font: 700 30px Consolas, 'Liberation Mono', monospace; }
    .accent { fill: #93c5fd; font: 700 16px Consolas, 'Liberation Mono', monospace; }
    .green { fill: #052e16; font: 700 15px Consolas, 'Liberation Mono', monospace; }
    .white { fill: #ffffff; font: 700 16px Consolas, 'Liberation Mono', monospace; }
    .line { stroke: #334155; stroke-width: 1; }
  </style>
  <rect class="bg" width="1200" height="720" rx="18"/>
  <rect x="30" y="28" width="1140" height="664" rx="14" fill="#060b16" stroke="#263244" stroke-width="2"/>
  <circle cx="58" cy="54" r="7" fill="#ef4444"/>
  <circle cx="82" cy="54" r="7" fill="#f59e0b"/>
  <circle cx="106" cy="54" r="7" fill="#22c55e"/>

  <rect x="52" y="84" width="126" height="34" rx="5" class="tab-active"/>
  <text x="68" y="107" class="title">GemGate</text>
  <rect x="194" y="86" width="58" height="30" rx="5" class="green-pill"/>
  <text x="205" y="106" class="green">LIVE</text>
  <rect x="266" y="86" width="130" height="30" rx="5" class="muted-pill"/>
  <text x="280" y="106" class="text">listen :8080</text>
  <rect x="410" y="86" width="104" height="30" rx="5" class="muted-pill"/>
  <text x="424" y="106" class="text">1 clients</text>
  <text x="535" y="106" class="small">updated 15:04:05</text>

  <rect x="52" y="134" width="168" height="34" rx="4" class="tab-active"/>
  <text x="70" y="156" class="white">1 Overview</text>
  <rect x="222" y="134" width="116" height="34" rx="4" class="tab"/>
  <text x="240" y="156" class="text">2 Logs</text>
  <rect x="340" y="134" width="142" height="34" rx="4" class="tab"/>
  <text x="358" y="156" class="text">3 Clients</text>
  <rect x="484" y="134" width="132" height="34" rx="4" class="tab"/>
  <text x="502" y="156" class="text">4 Routes</text>
  <rect x="618" y="134" width="132" height="34" rx="4" class="tab"/>
  <text x="636" y="156" class="text">5 Config</text>
  <rect x="752" y="134" width="110" height="34" rx="4" class="tab"/>
  <text x="770" y="156" class="text">6 Help</text>

  <rect x="52" y="190" width="1096" height="292" rx="10" class="panel"/>
  <text x="78" y="224" class="accent">Traffic overview</text>

  <g transform="translate(78 246)">
    <rect width="248" height="92" rx="8" class="card"/>
    <text x="18" y="26" class="small">Requests</text>
    <text x="18" y="62" class="value">128</text>
    <text x="18" y="82" class="small">14/min recent</text>
  </g>
  <g transform="translate(344 246)">
    <rect width="248" height="92" rx="8" class="card"/>
    <text x="18" y="26" class="small">Success</text>
    <text x="18" y="62" class="value">97.7%</text>
    <text x="18" y="82" class="small">125 ok responses</text>
  </g>
  <g transform="translate(610 246)">
    <rect width="248" height="92" rx="8" class="card"/>
    <text x="18" y="26" class="small">Errors</text>
    <text x="18" y="62" class="value">3</text>
    <text x="18" y="82" class="small">2 4xx / 1 5xx</text>
  </g>
  <g transform="translate(876 246)">
    <rect width="248" height="92" rx="8" class="card"/>
    <text x="18" y="26" class="small">Latency</text>
    <text x="18" y="62" class="value">812ms</text>
    <text x="18" y="82" class="small">p95 recent</text>
  </g>

  <g transform="translate(78 358)">
    <rect width="248" height="92" rx="8" class="card"/>
    <text x="18" y="26" class="small">In-flight</text>
    <text x="18" y="62" class="value">2</text>
    <text x="18" y="82" class="small">active upstream calls</text>
  </g>
  <g transform="translate(344 358)">
    <rect width="248" height="92" rx="8" class="card"/>
    <text x="18" y="26" class="small">Rate limited</text>
    <text x="18" y="62" class="value">1</text>
    <text x="18" y="82" class="small">429 responses</text>
  </g>
  <g transform="translate(610 358)">
    <rect width="248" height="92" rx="8" class="card"/>
    <text x="18" y="26" class="small">Bytes out</text>
    <text x="18" y="62" class="value">2.7MiB</text>
    <text x="18" y="82" class="small">proxied downstream</text>
  </g>
  <g transform="translate(876 358)">
    <rect width="248" height="92" rx="8" class="card"/>
    <text x="18" y="26" class="small">Uptime</text>
    <text x="18" y="62" class="value">3h12m</text>
    <text x="18" y="82" class="small">since start</text>
  </g>

  <rect x="52" y="504" width="1096" height="86" rx="10" class="panel"/>
  <text x="78" y="538" class="accent">Traffic</text>
  <text x="78" y="566" class="value">··▁▂▃▅▇█▆▅▃▂▁···▂▄▆█</text>
  <text x="78" y="586" class="small">last 20 minutes, each block is one minute</text>

  <rect x="52" y="610" width="1096" height="56" rx="10" class="panel"/>
  <text x="78" y="642" class="small">tab/right next   r refresh   space/p pause   ? help   q quit</text>
</svg>
