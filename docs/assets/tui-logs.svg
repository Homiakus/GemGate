<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GemGate TUI logs screen">
  <title>GemGate TUI logs screen</title>
  <style>
    .bg { fill: #0b1020; }
